version: 2

project_name: heimdall

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: heimdall
    main: ./cmd/heimdall
    binary: heimdall
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: darwin
        goarch: amd64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X github.com/JeremyDev87/heimdall/internal/cli.Version={{ .Version }}
        -X github.com/JeremyDev87/heimdall/internal/cli.Commit={{ .FullCommit }}
        -X github.com/JeremyDev87/heimdall/internal/cli.BuildDate={{ .CommitDate }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      group: root
      owner: root
      mtime: "{{ .CommitDate }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: true
