name: Linux real target

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DDALGGAK_REPOSITORY: JeremyDev87/ddalggak
  DDALGGAK_REVISION: 89868c05ca781365701362db08666bca503901b2

jobs:
  ddalggak:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Heimdall
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch pinned ddalggak target
        env:
          TARGET_DIR: ${{ runner.temp }}/ddalggak-target
        run: |
          set -euo pipefail
          git init "$TARGET_DIR"
          git -C "$TARGET_DIR" remote add origin "https://github.com/${DDALGGAK_REPOSITORY}.git"
          git -C "$TARGET_DIR" fetch --depth=1 origin "$DDALGGAK_REVISION"
          git -C "$TARGET_DIR" checkout --detach "$DDALGGAK_REVISION"
          test "$(git -C "$TARGET_DIR" rev-parse HEAD)" = "$DDALGGAK_REVISION"
          test -z "$(git -C "$TARGET_DIR" status --porcelain=v1 --untracked-files=all)"

      - name: Run pinned Linux real-target gate
        id: real_target
        env:
          TARGET_DIR: ${{ runner.temp }}/ddalggak-target
          ARTIFACT_DIR: ${{ runner.temp }}/heimdall-ddalggak-real-target
          REQUIRE_CLEAN_HEIMDALL: "1"
        run: |
          set -euo pipefail
          bash scripts/verify-ddalggak-real-target.sh \
            "$TARGET_DIR" \
            "$ARTIFACT_DIR" \
            "$DDALGGAK_REVISION" \
            "$GITHUB_SHA"

      - name: Record CI execution receipt
        if: always()
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/heimdall-ddalggak-real-target
          VERIFIER_STEP_OUTCOME: ${{ steps.real_target.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "schema_version": "1.0",
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "heimdall_revision": os.environ["GITHUB_SHA"],
              "target_repository": os.environ["DDALGGAK_REPOSITORY"],
              "target_revision": os.environ["DDALGGAK_REVISION"],
              "runner": {
                  "os": os.environ["RUNNER_OS"],
                  "arch": os.environ["RUNNER_ARCH"],
              },
              "verifier_step_outcome": os.environ.get("VERIFIER_STEP_OUTCOME", "skipped"),
          }
          path = Path(os.environ["ARTIFACT_DIR"]) / "ci-receipt.json"
          path.write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload real-target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heimdall-ddalggak-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/heimdall-ddalggak-real-target/run-1
            ${{ runner.temp }}/heimdall-ddalggak-real-target/run-2
            ${{ runner.temp }}/heimdall-ddalggak-real-target/receipt.json
            ${{ runner.temp }}/heimdall-ddalggak-real-target/ci-receipt.json
          if-no-files-found: error
          retention-days: 14
