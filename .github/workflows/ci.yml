name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./... -count=1
      - name: Build
        run: go build -trimpath -o /tmp/heimdall ./cmd/heimdall

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build supported artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /tmp/heimdall-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/heimdall

  package-snapshot:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Build first snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

      - name: Verify first snapshot
        run: |
          set -euo pipefail
          bash scripts/verify-release.sh dist "" "$GITHUB_SHA"
          cp -R dist "$RUNNER_TEMP/heimdall-dist-1"

      - name: Build second snapshot
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean

      - name: Verify deterministic repeat and negative probes
        run: |
          set -euo pipefail
          bash scripts/verify-release.sh dist "" "$GITHUB_SHA"
          cmp "$RUNNER_TEMP/heimdall-dist-1/checksums.txt" dist/checksums.txt
          for archive in dist/*.tar.gz; do
            cmp "$RUNNER_TEMP/heimdall-dist-1/$(basename "$archive")" "$archive"
          done

          tampered="$RUNNER_TEMP/heimdall-dist-tampered"
          cp -R dist "$tampered"
          printf 'tamper\n' >> "$tampered"/heimdall_*_linux_amd64.tar.gz
          if bash scripts/verify-release.sh "$tampered" "" "$GITHUB_SHA"; then
            printf 'tampered archive was accepted\n' >&2
            exit 1
          fi

          missing="$RUNNER_TEMP/heimdall-dist-missing"
          cp -R dist "$missing"
          rm "$missing"/heimdall_*_darwin_arm64.tar.gz
          if bash scripts/verify-release.sh "$missing" "" "$GITHUB_SHA"; then
            printf 'missing archive was accepted\n' >&2
            exit 1
          fi

          unsafe="$RUNNER_TEMP/heimdall-dist-unsafe-member"
          cp -R dist "$unsafe"
          fixture="$RUNNER_TEMP/heimdall-unsafe-member-fixture"
          mkdir -p "$fixture"
          cp LICENSE README.md "$fixture/"
          ln -s /bin/sh "$fixture/heimdall"
          rm "$unsafe"/heimdall_*_linux_amd64.tar.gz
          darwin_name=$(basename "$unsafe"/heimdall_*_darwin_arm64.tar.gz)
          unsafe_version=${darwin_name#heimdall_}
          unsafe_version=${unsafe_version%_darwin_arm64.tar.gz}
          COPYFILE_DISABLE=1 tar -czf "$unsafe/heimdall_${unsafe_version}_linux_amd64.tar.gz" \
            -C "$fixture" LICENSE README.md heimdall
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$unsafe" && sha256sum -- *.tar.gz > checksums.txt)
          else
            (cd "$unsafe" && shasum -a 256 -- *.tar.gz > checksums.txt)
          fi
          if bash scripts/verify-release.sh "$unsafe" "" "$GITHUB_SHA" structural; then
            printf 'unsafe archive member was accepted\n' >&2
            exit 1
          fi

      - name: Upload snapshot evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heimdall-snapshot-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/artifacts.json
            dist/metadata.json
          if-no-files-found: error
          retention-days: 14
