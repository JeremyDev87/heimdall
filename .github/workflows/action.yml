name: Composite Action

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  action-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: pass
        name: PASS verdict and outputs
        uses: ./
        with:
          manifest: fixtures/pass/eval.yaml
        continue-on-error: true
      - name: Assert PASS contract
        env:
          OUTCOME: ${{ steps.pass.outcome }}
          STATE: ${{ steps.pass.outputs.state }}
          EXIT_CODE: ${{ steps.pass.outputs.exit-code }}
          EVIDENCE_DIGEST: ${{ steps.pass.outputs.evidence-digest }}
          REPORT_DIGEST: ${{ steps.pass.outputs.report-digest }}
          VERSION: ${{ steps.pass.outputs.binary-version }}
          COMMIT: ${{ steps.pass.outputs.binary-commit }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = success
          test "$STATE" = PASS
          test "$EXIT_CODE" = 0
          test -n "$EVIDENCE_DIGEST"
          test -n "$REPORT_DIGEST"
          test "$VERSION" = 0.1.0
          test "$COMMIT" = 1cc04368aebe25d459cc65796855a9f3e9ce3338
      - id: fail
        name: FAIL exit and output preservation
        uses: ./
        with:
          manifest: fixtures/forbidden-write/eval.yaml
        continue-on-error: true
      - name: Assert FAIL contract
        env:
          OUTCOME: ${{ steps.fail.outcome }}
          STATE: ${{ steps.fail.outputs.state }}
          EXIT_CODE: ${{ steps.fail.outputs['exit-code'] }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$STATE" = FAIL
          test "$EXIT_CODE" = 1
      - id: false-pass
        name: INCONCLUSIVE exit and output preservation
        uses: ./
        with:
          manifest: fixtures/false-pass/eval.yaml
        continue-on-error: true
      - name: Assert INCONCLUSIVE contract
        env:
          OUTCOME: ${{ steps.false-pass.outcome }}
          STATE: ${{ steps.false-pass.outputs.state }}
          EXIT_CODE: ${{ steps.false-pass.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$STATE" = INCONCLUSIVE
          test "$EXIT_CODE" = 3
      - id: blocked
        name: BLOCKED exit and output preservation
        uses: ./
        with:
          manifest: fixtures/blocked/eval.yaml
        continue-on-error: true
      - name: Assert BLOCKED contract
        env:
          OUTCOME: ${{ steps.blocked.outcome }}
          STATE: ${{ steps.blocked.outputs.state }}
          EXIT_CODE: ${{ steps.blocked.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$OUTCOME" = failure
          test "$STATE" = BLOCKED
          test "$EXIT_CODE" = 2
